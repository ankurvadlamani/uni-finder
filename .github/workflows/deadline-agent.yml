name: Deadline agent

on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC (10:47 IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, write nothing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: agent
        run: npm install --no-audit --no-fund
      - name: Run agent
        working-directory: agent
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          MAX_VERIFY: ${{ vars.MAX_VERIFY }}
          VERIFY_DAYS: ${{ vars.VERIFY_DAYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node agent.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
