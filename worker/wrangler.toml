name = "uni-finder-ai"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
# Your Firebase project ID (Firebase console → Project settings)
FIREBASE_PROJECT_ID = "your-firebase-project-id"
# Comma-separated list of sites allowed to call the worker
ALLOWED_ORIGINS = "https://ankurvadlamani.github.io"
# AI "credits" per user per day (search = 3, re-check = 2, assess/SOP = 1, ask = 2)
DAILY_LIMIT = "40"
GEMINI_MODEL = "gemini-2.5-flash"

# Per-user daily limit storage. Create it with:
#   npx wrangler kv namespace create RATE
# then paste the id it prints below.
[[kv_namespaces]]
binding = "RATE"
id = "paste-kv-namespace-id-here"

# Secret (never put it in this file):
#   npx wrangler secret put GEMINI_API_KEY
